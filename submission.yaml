submission:
  title: "SupplyShield AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain managers and logistics companies face severe financial and operational losses due to unforeseen disruptions like port closures, extreme weather, and strikes. Existing tools lack real-time risk assessment and automated recovery planning, causing delayed responses.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    SupplyShield AI is a comprehensive platform that aggregates real-time disruption data, calculates risk scores for active shipments, and uses an AI Copilot to generate actionable recovery plans. It helps operators proactively reroute fleets and mitigate delays.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Dynamic shipment risk scoring based on active disruptions and delivery deadlines"
    - "Real-time cold chain temperature monitoring and excursion alerts"
    - "Automated recovery plan generation (simulate and apply alternative routes/carriers)"
    - "AI Copilot conversational interface for querying supply chain status"
    - "Interactive dashboard with KPI aggregations and disruption severity mapping"

  tech_stack:
    languages: ["JavaScript", "HTML", "CSS"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React 19", "Vite", "TailwindCSS v4", "Express 5"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai (Stubbed)"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["In-Memory Store (NoSQL structured)"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Node.js", "React Router", "Recharts"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We built a completely functional, zero-configuration backend utilizing an in-memory data store with complex relationships (disruptions linked to routes linked to shipments) and an automated risk calculation engine that dynamically updates based on real-time factors.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The IBM watsonx.ai integration is currently a stub due to missing API keys. The AI Copilot uses keyword matching on the backend rather than a real LLM. The database is in-memory and will reset on server restart.

